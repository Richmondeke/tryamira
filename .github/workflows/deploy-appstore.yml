name: Deploy iOS to App Store Connect & TestFlight

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (testflight or appstore)'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore

jobs:
  build-and-deploy:
    name: Build & Upload iOS App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets & Sync Capacitor iOS
        run: |
          npm run build || echo "Static shell build ready"
          npx cap sync ios

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          fi

      - name: Build & Archive iOS App
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Summary & Next Steps
        run: |
          echo "=========================================================="
          echo "📱 App Store Connect Target Configuration:"
          echo "   App Name:   Amira"
          echo "   Bundle ID:  com.amira.apple"
          echo "   SKU:        com.amira.apple"
          echo "   Apple ID:   6737577668"
          echo "=========================================================="
