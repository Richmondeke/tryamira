<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Website — Amira Chatbot Embed Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 3rem;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    h1 { margin-top: 0; color: #1b5a92; }
    p { line-height: 1.6; color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Acme Growth Solutions — Customer Site</h1>
    <p>This is a simulated external client website (e.g. Shopify, Webflow, WordPress) embedding the Amira AI Webchat Widget.</p>
    <p>Look at the bottom right corner for the floating Amira AI chat bubble!</p>
  </div>

  <!-- Amira AI Webchat Embed Snippet -->
  <script>
    window.AmiraConfig = {
      agentId: "ea677cb6-9bbd-43e2-9fa4-17542867abe6",
      primaryColor: "#1b5a92",
      position: "bottom-right",
      welcomeMessage: "Hi there! 👋 Welcome to Acme. How can I help your team today?",
      theme: "light"
    };
  </script>
  <script src="/widget.js" async></script>
</body>
</html>
